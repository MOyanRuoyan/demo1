<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人技术博客</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0a0f;
    color: #fff;
    font-family: "Microsoft Yahei", -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: none;
}
.grid-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background-image: 
        linear-gradient(rgba(0, 255, 170, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 170, 0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 60px 60px; }
}
.lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    pointer-events: none;
}
.line {
    position: absolute;
    background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.3), transparent);
    height: 1px;
    animation: lineMove 8s ease-in-out infinite;
}
@keyframes lineMove {
    0% { transform: translateX(-100%); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateX(100%); opacity: 0; }
}
.particles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
}
.particle {
    position: absolute;
    width: 4px; height: 4px;
    background: #00ffaa;
    border-radius: 50%;
    box-shadow: 0 0 6px #00ffaa;
    animation: particleFloat 6s ease-in-out infinite;
}
@keyframes particleFloat {
    0%, 100% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-30px); opacity: 1; }
}
.cursor-glow {
    position: fixed;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 255, 170, 0.15) 0%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 1;
    transition: width 0.3s, height 0.3s;
}
.cursor-dot {
    position: fixed;
    width: 8px;
    height: 8px;
    background: #00ffaa;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9999;
    box-shadow: 0 0 10px #00ffaa, 0 0 20px rgba(0, 255, 170, 0.5);
    transition: width 0.2s, height 0.2s;
}
.cursor-dot.clicking {
    width: 16px;
    height: 16px;
}
.drag-trail {
    position: fixed;
    width: 6px;
    height: 6px;
    background: #00ffaa;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
}
.ripple {
    position: fixed;
    width: 20px;
    height: 20px;
    border: 2px solid #00ffaa;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 9997;
    animation: rippleExpand 0.8s ease-out forwards;
}
@keyframes rippleExpand {
    0% {
        width: 20px;
        height: 20px;
        opacity: 1;
    }
    100% {
        width: 150px;
        height: 150px;
        opacity: 0;
    }
}
.explosion-particle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: #00ffaa;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9996;
    box-shadow: 0 0 8px currentColor;
}
.container {
    text-align: center;
    z-index: 10;
    animation: fadeInUp 1.2s ease-out;
    position: relative;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}
.title {
    font-size: 64px;
    font-weight: bold;
    margin-bottom: 20px;
    background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 50%, #7b61ff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    text-shadow: 0 0 80px rgba(0, 255, 170, 0.3);
    transition: transform 0.3s ease;
}
.subtitle {
    font-size: 20px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 50px;
    letter-spacing: 3px;
}
.enter-btn {
    display: inline-block;
    padding: 16px 60px;
    font-size: 18px;
    font-weight: bold;
    color: #0a0a0f;
    background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 100%);
    border: none;
    border-radius: 50px;
    cursor: none;
    text-decoration: none;
    letter-spacing: 4px;
    transition: all 0.3s ease;
    box-shadow: 0 0 30px rgba(0, 255, 170, 0.4);
    position: relative;
    overflow: hidden;
}
.enter-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 0 50px rgba(0, 255, 170, 0.6);
}
.enter-btn::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: btnShine 3s ease-in-out infinite;
}
@keyframes btnShine {
    0% { transform: translateX(-100%) rotate(45deg); }
    100% { transform: translateX(100%) rotate(45deg); }
}
.floating-shape {
    position: absolute;
    border: 1px solid rgba(0, 255, 170, 0.15);
    border-radius: 50%;
    animation: float 10s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(20px, -20px); }
    50% { transform: translate(-10px, -10px); }
    75% { transform: translate(-20px, 10px); }
}
.shape1 { width: 200px; height: 200px; top: 15%; left: 10%; animation-delay: 0s; }
.shape2 { width: 150px; height: 150px; top: 60%; left: 80%; animation-delay: 2s; }
.shape3 { width: 100px; height: 100px; top: 70%; left: 20%; animation-delay: 4s; }
.shape4 { width: 80px; height: 80px; top: 20%; right: 15%; animation-delay: 1s; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="lines">
    <div class="line" style="top: 20%; animation-delay: 0s;"></div>
    <div class="line" style="top: 40%; animation-delay: 2s;"></div>
    <div class="line" style="top: 60%; animation-delay: 4s;"></div>
    <div class="line" style="top: 80%; animation-delay: 1s;"></div>
</div>
<div class="particles" id="particles"></div>
<div class="floating-shape shape1"></div>
<div class="floating-shape shape2"></div>
<div class="floating-shape shape3"></div>
<div class="floating-shape shape4"></div>

<div class="cursor-glow" id="cursorGlow"></div>
<div class="cursor-dot" id="cursorDot"></div>

<div class="container">
    <h1 class="title" id="mainTitle">个人技术博客</h1>
    <p class="subtitle">以线条构筑世界 · 以代码记录成长</p>
    <a href="home.html" class="enter-btn" id="enterBtn">进入主页</a>
</div>

<script>
const cursorGlow = document.getElementById('cursorGlow');
const cursorDot = document.getElementById('cursorDot');
const enterBtn = document.getElementById('enterBtn');
const mainTitle = document.getElementById('mainTitle');

let mouseX = 0, mouseY = 0;
let glowX = 0, glowY = 0;
const trailParticles = [];

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    
    cursorDot.style.left = mouseX + 'px';
    cursorDot.style.top = mouseY + 'px';
    
    for (let i = 0; i < 2; i++) {
        createTrailParticle(mouseX, mouseY);
    }
});

function createTrailParticle(x, y) {
    const particle = document.createElement('div');
    particle.className = 'drag-trail';
    particle.style.left = x + 'px';
    particle.style.top = y + 'px';
    
    const hue = 150 + Math.random() * 60;
    particle.style.background = `hsl(${hue}, 100%, 60%)`;
    particle.style.boxShadow = `0 0 6px hsl(${hue}, 100%, 60%)`;
    
    document.body.appendChild(particle);
    trailParticles.push({
        element: particle,
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        life: 1
    });
}

function updateTrail() {
    for (let i = trailParticles.length - 1; i >= 0; i--) {
        const p = trailParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        
        p.element.style.left = p.x + 'px';
        p.element.style.top = p.y + 'px';
        p.element.style.opacity = p.life;
        p.element.style.transform = `translate(-50%, -50%) scale(${p.life})`;
        
        if (p.life <= 0) {
            p.element.remove();
            trailParticles.splice(i, 1);
        }
    }
    requestAnimationFrame(updateTrail);
}
updateTrail();

function animateGlow() {
    glowX += (mouseX - glowX) * 0.1;
    glowY += (mouseY - glowY) * 0.1;
    cursorGlow.style.left = glowX + 'px';
    cursorGlow.style.top = glowY + 'px';
    requestAnimationFrame(animateGlow);
}
animateGlow();

document.addEventListener('mousedown', (e) => {
    cursorDot.classList.add('clicking');
    createRipple(e.clientX, e.clientY);
    createExplosion(e.clientX, e.clientY);
});

document.addEventListener('mouseup', () => {
    cursorDot.classList.remove('clicking');
});

function createRipple(x, y) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);
}

function createExplosion(x, y) {
    const particleCount = 20;
    for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'explosion-particle';
        
        const angle = (Math.PI * 2 * i) / particleCount;
        const velocity = 60 + Math.random() * 80;
        const hue = 150 + Math.random() * 80;
        
        particle.style.background = `hsl(${hue}, 100%, 60%)`;
        particle.style.color = `hsl(${hue}, 100%, 60%)`;
        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        
        document.body.appendChild(particle);
        
        const dx = Math.cos(angle) * velocity;
        const dy = Math.sin(angle) * velocity;
        
        let posX = x, posY = y;
        let vx = dx, vy = dy;
        let life = 1;
        
        const animate = () => {
            posX += vx * 0.05;
            posY += vy * 0.05;
            vy += 0.5;
            life -= 0.02;
            
            particle.style.left = posX + 'px';
            particle.style.top = posY + 'px';
            particle.style.opacity = life;
            particle.style.transform = `translate(-50%, -50%) scale(${life})`;
            
            if (life > 0) {
                requestAnimationFrame(animate);
            } else {
                particle.remove();
            }
        };
        animate();
    }
}

enterBtn.addEventListener('mouseenter', () => {
    cursorGlow.style.width = '600px';
    cursorGlow.style.height = '600px';
});

enterBtn.addEventListener('mouseleave', () => {
    cursorGlow.style.width = '400px';
    cursorGlow.style.height = '400px';
});

document.addEventListener('mousemove', (e) => {
    const rect = mainTitle.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const offsetX = (e.clientX - centerX) * 0.02;
    const offsetY = (e.clientY - centerY) * 0.02;
    mainTitle.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
});

for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.top = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 6 + 's';
    p.style.animationDuration = (4 + Math.random() * 4) + 's';
    document.getElementById('particles').appendChild(p);
}
</script>
</body>
</html>
